<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pearls Construction CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,500..800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F0F2F5; --surface:#FFFFFF; --surface2:#F6F7F9; --ink:#14202B; --muted:#5B6873; --line:#E1E5EA;
  --side:#0F1E2B; --side2:#183041; --side-ink:#E4EAEF; --side-muted:#8DA0AF;
  --gold:#E0A526; --gold-ink:#1E1503; --focus:#2A76A6; --danger:#B3402F;
  --c-new:#66737E; --c-trying:#7B5EA7; --c-contacted:#2A76A6; --c-qualified:#17877A; --c-proposal:#B77E0C; --c-negotiation:#C25A1C; --c-won:#3F7D22; --c-lost:#A63F35; --c-notqualified:#8A6248; --c-onhold:#B0507A;
  --shadow:0 1px 2px rgba(15,30,43,.06),0 6px 18px rgba(15,30,43,.05);
  --head:'Archivo','Arial Narrow',Arial,sans-serif; --body:'Public Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0B1218; --surface:#141F28; --surface2:#101A22; --ink:#E8EDF1; --muted:#93A1AD; --line:#233240;
    --side:#08111A; --side2:#122433; --danger:#E27A6C; --focus:#5AA6D3;
    --c-new:#9AA5AD; --c-trying:#B39DDB; --c-contacted:#5AA6D3; --c-qualified:#4CC2B2; --c-proposal:#E0B04A; --c-negotiation:#EE8E57; --c-won:#7CBF57; --c-lost:#E07A70; --c-notqualified:#C2A08A; --c-onhold:#E091B4;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg:#0B1218; --surface:#141F28; --surface2:#101A22; --ink:#E8EDF1; --muted:#93A1AD; --line:#233240;
  --side:#08111A; --side2:#122433; --danger:#E27A6C; --focus:#5AA6D3;
  --c-new:#9AA5AD; --c-trying:#B39DDB; --c-contacted:#5AA6D3; --c-qualified:#4CC2B2; --c-proposal:#E0B04A; --c-negotiation:#EE8E57; --c-won:#7CBF57; --c-lost:#E07A70; --c-notqualified:#C2A08A; --c-onhold:#E091B4;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
[hidden]{display:none!important}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.ic{width:18px;height:18px;flex:none}
.ic.lg{width:22px;height:22px}
.ic.sm{width:15px;height:15px}

/* shell */
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{background:linear-gradient(180deg,var(--side) 0%,var(--side2) 140%);color:var(--side-ink);position:sticky;top:0;height:100vh;height:100dvh;display:flex;flex-direction:column;padding:26px 16px 18px}
.side .logo{display:block;width:100%;max-width:196px;height:auto;margin:0 auto 26px}
.nav{display:flex;flex-direction:column;gap:4px}
.nav-item{display:flex;align-items:center;gap:12px;background:none;border:0;color:var(--side-muted);padding:11px 14px;border-radius:10px;font:600 15px var(--body);cursor:pointer;text-align:left;position:relative}
.nav-item:hover{background:rgba(255,255,255,.06);color:var(--side-ink)}
.nav-item.on{background:rgba(224,165,38,.14);color:#fff}
.nav-item.on::before{content:"";position:absolute;left:-16px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--gold)}
.nav-item.on .ic{color:var(--gold)}
.nav-item .bd{margin-left:auto;background:rgba(255,255,255,.1);color:var(--side-ink);border-radius:999px;font-size:12px;padding:1px 8px;font-weight:600;min-width:24px;text-align:center}
.side .foot{margin-top:auto;color:var(--side-muted);font-size:12.5px;padding:0 6px}
.main{padding:24px 30px 60px;min-width:0;max-width:1500px;width:100%}

/* page header */
.ph{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:22px}
.ph h1{margin:0;font:700 30px/1.1 var(--head);font-stretch:108%;letter-spacing:-.01em}
.ph .sub{color:var(--muted);font-size:14px;margin-top:4px}
.ph .acts{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;font-size:14px;cursor:pointer;line-height:1.2;color:var(--ink)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.small{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.icon{padding:9px}
select,input[type=text],input[type=search],input[type=number],input[type=date],input[type=email],input[type=tel],input[type=password],textarea{
  background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;min-width:0;width:100%}
select{width:auto;cursor:pointer}
textarea{resize:vertical;min-height:84px}
#banner:empty{display:none}
.banner{background:var(--surface);border:1px solid var(--c-proposal);border-left:5px solid var(--c-proposal);border-radius:10px;padding:10px 14px;margin-bottom:16px;font-size:14px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 20px;min-width:0}
.card h3{margin:0;font:700 17px var(--head);font-stretch:106%}
.card .hint{color:var(--muted);font-size:13.5px;margin:2px 0 0}
.card-head{display:flex;align-items:center;gap:8px;margin-bottom:16px}
.card-head .sp{margin-left:auto}
.iconbtn{background:none;border:0;cursor:pointer;color:var(--muted);padding:6px;border-radius:8px;display:inline-flex}
.iconbtn:hover{color:var(--ink);background:var(--surface2)}
.stack{display:grid;gap:16px}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px}
.kpi{display:flex;gap:14px;align-items:flex-start;padding:16px 18px}
.chip-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--kc) 15%,transparent);color:var(--kc);flex:none}
.kpi .k{color:var(--muted);font-size:13.5px;font-weight:500}
.kpi .x{font:700 28px/1.15 var(--head);letter-spacing:-.02em;margin-top:2px}
.kpi .s{color:var(--muted);font-size:13px;margin-top:2px;display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.up{color:var(--c-won);font-weight:600}.down{color:var(--danger);font-weight:600}

/* pipeline at a glance */
.seg{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--surface2);gap:2px;margin-bottom:16px}
.seg i{display:block;height:100%;background:var(--sc)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{position:relative;text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:13px 14px;cursor:pointer;display:block;width:100%;transition:transform .12s,border-color .12s}
.tile:hover{border-color:var(--sc);transform:translateY(-1px)}
.tile .tp{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tile .chip-ic{width:34px;height:34px;border-radius:10px;--kc:var(--sc)}
.tile .ct{font:700 30px/1 var(--head);letter-spacing:-.02em}
.tile .nm{font-weight:600;font-size:14px;margin-top:10px}
.tile .val{color:var(--muted);font-size:13px}

/* marketing analysis */
.mk-top{display:grid;grid-template-columns:1fr 200px;gap:18px;align-items:center}
.mk-chart{position:relative;height:260px;padding-left:38px}
.mk-grid{position:absolute;left:38px;right:0;top:14px;bottom:36px}
.mk-grid div{position:absolute;left:0;right:0;border-top:1px dashed var(--line)}
.mk-grid span{position:absolute;left:-38px;top:-9px;width:30px;text-align:right;font-size:12px;color:var(--muted)}
.mk-cols{position:absolute;left:38px;right:0;top:14px;bottom:0;display:grid;grid-template-columns:1fr 84px 1fr 84px 1fr}
.mk-col{display:flex;flex-direction:column}
.mk-area{position:relative;flex:1}
.mk-bar{position:absolute;bottom:0;left:50%;width:min(96px,62%);transform:translateX(-50%);background:linear-gradient(180deg,var(--bc),color-mix(in srgb,var(--bc) 62%,transparent));border-radius:10px 10px 0 0}
.mk-val{position:absolute;left:0;right:0;text-align:center;font:700 15px var(--head)}
.mk-lbl{height:36px;display:flex;align-items:center;justify-content:center;font-size:13.5px;color:var(--muted);border-top:1px solid var(--line)}
.mk-arrow{display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:36px;font-size:14px;gap:2px}
.mk-arrow b{font-size:15px}
.mk-arrow .ic{color:var(--muted)}
.ringbox{position:relative;width:170px;height:170px;margin:0 auto}
.ring{width:100%;height:100%}
.ringtxt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ringtxt b{font:700 34px/1 var(--head);letter-spacing:-.02em}
.ringtxt span{font-size:12.5px;color:var(--muted);margin-top:4px}
.ringcap{text-align:center;color:var(--muted);font-size:13px;margin-top:10px}
.ringcap b{color:var(--ink)}
.mk-table{margin-top:18px;border:1px solid var(--line);border-radius:12px;overflow-x:auto}
.mk-table table{min-width:660px}
.mk-table td small{color:var(--muted);margin-left:8px;font-size:13px}
.mk-table tbody tr:last-child td{border-top:1px solid var(--line);font-weight:700;background:var(--surface2)}
.mk-table tbody tr:last-child{cursor:default}
.c{text-align:center}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-weight:700;font-size:13px;background:var(--surface2);color:var(--muted)}
.pill.good{background:color-mix(in srgb,var(--c-won) 16%,transparent);color:var(--c-won)}

/* lists on dashboard */
.trio{display:grid;grid-template-columns:repeat(auto-fit,minmax(310px,1fr));gap:16px}
.li{display:flex;gap:12px;align-items:center;padding:10px 6px;border-radius:10px;cursor:pointer}
.li+.li{border-top:1px solid var(--line)}
.li:hover{background:var(--surface2)}
.li .t{font-weight:600;line-height:1.25}
.li .s{color:var(--muted);font-size:13px}
.li .r{margin-left:auto;text-align:right;white-space:nowrap;padding-left:8px}
.li .body{min-width:0}
.li .body .t,.li .body .s{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.av{width:36px;height:36px;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font:700 13px var(--head);flex:none}
.av.sm{width:30px;height:30px;font-size:11.5px}
.av.lg{width:46px;height:46px;font-size:16px}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font:700 17px var(--head);margin-bottom:4px}
.empty .ic{width:30px;height:30px;color:var(--c-won);margin-bottom:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px 2px 7px;font-size:12.5px;font-weight:600;color:var(--sc);background:color-mix(in srgb,var(--sc) 14%,transparent);white-space:nowrap}
.chip .ic{width:13px;height:13px}
.due{white-space:nowrap;font-size:13.5px;display:inline-flex;align-items:center;gap:5px;color:var(--muted)}
.due.over{color:var(--danger);font-weight:600}
.due.today{color:var(--c-proposal);font-weight:600}
.tl{position:relative}
.feed .li{cursor:pointer;align-items:flex-start}
.dot{width:10px;height:10px;border-radius:50%;background:var(--gold);margin-top:7px;flex:none}

/* toolbar + table */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.search{position:relative;flex:1 1 240px;max-width:320px}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted)}
.search input{padding-left:36px}
.toolbar .count{margin-left:auto;color:var(--muted);font-size:14px}
.tablewrap{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow-x:auto;box-shadow:var(--shadow)}
table{border-collapse:collapse;width:100%;min-width:900px}
th{font:600 13px var(--body);text-align:left;color:var(--muted);padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface2)}
.who{display:flex;gap:12px;align-items:center}
.nm2{font-weight:600;line-height:1.25}
.sub{color:var(--muted);font-size:13px}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.stagewrap{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 6px 3px 10px;color:var(--sc);background:color-mix(in srgb,var(--sc) 13%,transparent)}
.stagewrap .ic{width:15px;height:15px}
.stagesel{border:0;background:transparent;color:var(--sc);font-weight:600;font-size:13.5px;padding:2px 4px 2px 0;cursor:pointer;width:auto}
.stagesel option{color:var(--ink);background:var(--surface)}
.contact{display:flex;gap:4px;align-items:center;color:var(--muted);font-size:13px}

/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,1fr);gap:14px;overflow-x:auto;padding-bottom:14px;align-items:start}
.col{background:var(--surface2);border:1px solid var(--line);border-radius:16px;min-height:220px;display:flex;flex-direction:column}
.col.over{outline:2px dashed var(--sc);outline-offset:-2px}
.col h3{margin:0;padding:14px 14px 12px;font:700 15px var(--head);font-stretch:105%;display:flex;align-items:center;gap:8px}
.col h3 .chip-ic{width:28px;height:28px;border-radius:8px;--kc:var(--sc)}
.col h3 .ic{width:16px;height:16px}
.col h3>span:last-child{margin-left:auto;font:500 12.5px var(--body);color:var(--muted);text-align:right}
.col .bar{height:3px;background:var(--sc);margin:0 14px 12px;border-radius:2px}
.col .cards{padding:0 10px 10px;display:flex;flex-direction:column;gap:9px;flex:1}
.card2{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;cursor:grab;box-shadow:var(--shadow);text-align:left;width:100%;display:block}
.card2:hover{border-color:var(--muted)}
.card2.drag{opacity:.4}
.card2 .top{display:flex;gap:10px;align-items:center}
.card2 .t{font-weight:600;line-height:1.25}
.card2 .row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:8px}
.card2 .v{font:700 16px var(--head)}
.card2 .mv{display:none;margin-top:10px;width:100%}
.dropnote{color:var(--muted);font-size:13px;text-align:center;padding:20px 6px;border:1px dashed var(--line);border-radius:12px}
@media (pointer:coarse){.card2 .mv{display:block}.card2{cursor:pointer}}

/* analytics */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-top:16px}
.hb{display:grid;grid-template-columns:110px 1fr 122px;gap:10px;align-items:center;margin:9px 0;font-size:14px}
.hb .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb .track{background:var(--surface2);border-radius:999px;height:20px;overflow:hidden}
.hb .track i{display:block;height:100%;background:var(--bc,var(--gold));border-radius:999px;min-width:4px}
.hb .val{font-variant-numeric:tabular-nums;text-align:right;min-width:70px;font-weight:600}
.hb .val em{font-style:normal;color:var(--muted);font-size:12.5px;font-weight:400}
.cols{display:flex;align-items:flex-end;gap:12px;height:180px;padding-top:8px}
.cols .cc{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:6px;font-size:13px}
.cols .cc i{display:block;width:100%;max-width:58px;background:linear-gradient(180deg,var(--gold),color-mix(in srgb,var(--gold) 55%,transparent));border-radius:8px 8px 0 0;min-height:3px}
.cols .cc b{font-weight:700}
.cols .cc span{color:var(--muted)}
.note{color:var(--muted);font-size:13px;margin-top:12px}

/* drawer */
#scrim{position:fixed;inset:0;background:rgba(8,14,20,.5);opacity:0;pointer-events:none;transition:opacity .15s;z-index:8}
#scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);background:var(--surface);border-left:1px solid var(--line);transform:translateX(102%);transition:transform .18s ease;overflow-y:auto;z-index:9;padding:calc(20px + env(safe-area-inset-top,0px)) 22px calc(26px + env(safe-area-inset-bottom,0px))}
#drawer.on{transform:none}
#drawer h2{margin:0;font:700 22px var(--head);font-stretch:108%}
.dh{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.dh .x-btn{margin-left:auto}
.x-btn{background:none;border:0;cursor:pointer;color:var(--muted);padding:6px;border-radius:8px;display:inline-flex}
.x-btn:hover{background:var(--surface2);color:var(--ink)}
.quick{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.quick a{text-decoration:none}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.form label input,.form label select,.form label textarea{margin-top:4px;font-weight:400;color:var(--ink);width:100%}
.form .full{grid-column:1/-1}
.actions{display:flex;gap:8px;margin-top:18px;align-items:center}
.actions .sp{margin-left:auto}
.log{margin-top:24px;border-top:1px solid var(--line);padding-top:16px}
.log h3{margin:0 0 10px;font:700 16px var(--head)}
.log ul{list-style:none;margin:0;padding:0;max-height:260px;overflow-y:auto}
.log li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.log li time{display:block;color:var(--muted);font-size:12.5px}
.addnote{display:flex;gap:8px;margin-bottom:10px}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .15s;z-index:30;max-width:90vw}
#toast.on{opacity:1}

/* login (hosted version) */
.login{position:fixed;inset:0;z-index:40;background:radial-gradient(1200px 600px at 20% 0%,var(--side2),var(--side));display:flex;align-items:center;justify-content:center;padding:20px}
.login[hidden]{display:none}
.lgbox{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px;width:min(390px,100%);display:grid;gap:10px}
.lgbox .lg{background:var(--side);border-radius:12px;padding:16px;margin-bottom:8px}
.lgbox .lg img{display:block;width:150px;margin:0 auto}
.lgbox label{font-size:13px;font-weight:600;color:var(--muted)}
.lgerr{color:var(--danger);font-size:14px;min-height:20px}
.lghint{font-size:12px;color:var(--muted);margin-top:-4px}
.owner{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.owner.none{color:var(--muted)}
.av.xs{width:22px;height:22px;font-size:10px}
.assignee{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:12px;color:var(--muted)}
.team-add{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:10px;align-items:end}
.team-add label{font-size:13px;font-weight:600;color:var(--muted)}
.team-add input{margin-top:4px;width:100%}
@media (max-width:760px){.team-add{grid-template-columns:1fr}}
.team-table td .acts2{display:flex;gap:6px;justify-content:flex-end}
.roletag{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);margin-left:6px;vertical-align:middle}
#toast a{color:inherit;font-weight:700;margin-left:10px;text-decoration:underline}
#toast.on.link{pointer-events:auto}

/* responsive */
@media (max-width:980px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:sticky;top:0;height:auto;flex-direction:row;align-items:center;padding:8px 16px;z-index:7}
  .side .logo{width:72px;margin:0}
  .side .foot{display:none}
  .nav{position:fixed;left:0;right:0;bottom:0;flex-direction:row;justify-content:space-around;gap:0;background:var(--side);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:7;border-top:1px solid rgba(255,255,255,.08)}
  .nav-item{flex-direction:column;gap:3px;padding:6px 10px;font-size:11.5px;border-radius:10px;flex:1;align-items:center}
  .nav-item .bd{display:none}
  .nav-item.on::before{left:24%;right:24%;top:0;bottom:auto;width:auto;height:3px;border-radius:0 0 4px 4px}
  .main{padding:18px 14px 96px}
  .ph h1{font-size:25px}
  .mk-top{grid-template-columns:1fr}
}
@media (max-width:640px){
  .form{grid-template-columns:1fr}
  .hb{grid-template-columns:84px 1fr auto}
  .mk-cols{grid-template-columns:1fr 54px 1fr 54px 1fr}
  .ph .acts{margin-left:0;width:100%}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .kpi{flex-direction:column;gap:10px;padding:14px}
  .kpi .x{font-size:24px}
}
@media (prefers-reduced-motion:reduce){#drawer,#scrim,#toast,.tile{transition:none}}
</style>
</head>
<body>
<div class="shell">
  <aside class="side">
    <img class="logo" data-logo alt="Pearls Construction LLC">
    <nav class="nav" aria-label="Sections" id="nav"></nav>
    <div class="foot">Pearls Construction LLC<br>Lead management</div>
  </aside>
  <div class="main">
    <header class="ph">
      <div><h1 id="ptitle">Dashboard</h1><div class="sub" id="psub"></div></div>
      <div class="acts">
        <select id="cur" aria-label="Currency">
          <option value="USD">USD</option><option value="EGP">EGP</option><option value="SAR">SAR</option>
          <option value="AED">AED</option><option value="GBP">GBP</option><option value="EUR">EUR</option>
        </select>
        <button class="btn icon" id="export" title="Export CSV" aria-label="Export CSV" hidden></button>
        <button class="btn icon" id="signout" type="button" title="Sign out" aria-label="Sign out" hidden></button>
        <button class="btn primary" id="add"></button>
      </div>
    </header>
    <div id="banner"></div>
    <main id="view"></main>
  </div>
</div>

<div id="login" class="login" hidden>
  <form id="lgform" class="lgbox">
    <div class="lg"><img data-logo alt="Pearls Construction LLC"></div>
    <label for="lgem">Email</label>
    <input type="email" id="lgem" autocomplete="username" placeholder="you@pearls.com">
    <div class="lghint">Admin: leave email empty and use the admin password.</div>
    <label for="lgpw">Password</label>
    <input type="password" id="lgpw" autocomplete="current-password">
    <div id="lgerr" class="lgerr" role="alert"></div>
    <button class="btn primary" type="submit" style="justify-content:center">Sign in</button>
  </form>
</div>

<div id="scrim"></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-labelledby="dtitle"></aside>
<div id="toast" role="status" aria-live="polite"></div>

  me:IN_CLAUDE?{role:'admin',name:'Admin',email:''}:null,team:[]};
let leadsCol=null,settingsDoc=null,downloads=null;
let PW=BUILT_IN_PASSWORD||null,EM='';
if(!IN_CLAUDE&&!PW){try{const s=JSON.parse(localStorage.getItem('pears_crm_auth')||'null');if(s&&s.p){PW=s.p;EM=s.e||''}else PW=localStorage.getItem('pears_crm_pw')}catch(e){}}
const isAdmin=()=>!!(state.me&&state.me.role==='admin');
const actor=()=>state.me?state.me.name:'';
const memberByEmail=e=>state.team.find(m=>m.email===String(e||'').toLowerCase());
const ownerName=l=>{if(!l.assignedTo)return '';const m=memberByEmail(l.assignedTo);return m?m.name:(l.assignedName||l.assignedTo)};
let dragId=null;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
function money(v,compact){
  try{return new Intl.NumberFormat('en',{style:'currency',currency:state.currency,maximumFractionDigits:0,notation:compact?'compact':'standard'}).format(v||0)}
  catch(e){return String(Math.round(v||0))}
}
function fmtDate(s){
  if(!s)return '';
  const [y,m,d]=s.split('-').map(Number);
  return new Date(y,m-1,d).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'});
}
function fmtTime(t){return new Date(t).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}
function ago(t){
  const s=(Date.now()-t)/1000;
  if(s<60)return 'just now';
  if(s<3600)return Math.floor(s/60)+' min ago';
  if(s<86400)return Math.floor(s/3600)+' h ago';
  if(s<604800)return Math.floor(s/86400)+' d ago';
  return new Date(t).toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}
function dueInfo(l,short){
  if(!l.followUp||!OPEN.includes(l.stage))return {cls:'',text:l.followUp?fmtDate(l.followUp):'—'};
  const t=today();
  if(l.followUp<t){
    if(short){const n=Math.max(1,Math.round((new Date(t)-new Date(l.followUp))/864e5));return {cls:'over',text:n+'d overdue'}}
    return {cls:'over',text:'Overdue · '+fmtDate(l.followUp)};
  }
  if(l.followUp===t)return {cls:'today',text:'Today'};
  return {cls:'',text:fmtDate(l.followUp)};
}
function toast(msg,href,linkText){
  const t=$('#toast');t.textContent=msg;
  if(href){const a=document.createElement('a');a.href=href;a.textContent=linkText||'Open';t.appendChild(a)}
  t.classList.toggle('link',!!href);t.classList.add('on');
  clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on','link'),href?9000:2600);
}
/* Ready-to-send email telling a team member a lead is theirs. */
function assignMailto(l){
  const m=memberByEmail(l.assignedTo);const to=m?m.email:l.assignedTo;if(!to)return '';
  const nm=m?m.name:(l.assignedName||'');
  const lines=['Hi '+(nm.split(' ')[0]||'')+',','','A new lead has been assigned to you in Pearls CRM:','',
    'Lead: '+l.name,l.company?'Company: '+l.company:null,l.phone?'Phone: '+l.phone:null,l.email?'Email: '+l.email:null,
    'Project: '+(l.project||'—')+(l.location?' · '+l.location:''),l.value?'Estimated value: '+money(l.value):null,
    'Source: '+(l.source||'—'),'Stage: '+(SNAME[l.stage]||l.stage),l.followUp?'Next follow-up: '+fmtDate(l.followUp):null,
    l.notes?'Notes: '+l.notes:null,'','Open the CRM: '+location.origin+'/','','Thanks,',actor()].filter(x=>x!==null);
  return 'mailto:'+encodeURIComponent(to)+'?subject='+encodeURIComponent('New lead assigned: '+l.name)+'&body='+encodeURIComponent(lines.join('\n'));
}
const newId=()=>'l_'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const clean=o=>JSON.parse(JSON.stringify(o));
const reached=l=>{const m=l.maxStage!=null?RANK[l.maxStage]:RANK[l.stage];return m==null?0:m};
const pct=(a,b)=>b?(Math.round(a/b*1000)/10)+'%':'0%';
const AV=['#1F5F86','#0F6F64','#634A8C','#8A5E08','#A34A14','#8F3A60','#2F6418','#45546E'];
function avColor(n){let h=0;for(const ch of String(n||''))h=(h*31+ch.charCodeAt(0))>>>0;return AV[h%AV.length]}
const initials=n=>String(n||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
const avatar=(n,c)=>'<span class="av '+(c||'')+'" style="--ac:'+avColor(n)+'">'+esc(initials(n))+'</span>';
const stageChip=id=>'<span class="chip" style="--sc:var(--c-'+id+')">'+ic(SICON[id])+esc(SNAME[id]||id)+'</span>';
const isOpen=l=>OPEN.includes(l.stage);
const sumV=a=>a.reduce((x,l)=>x+(+l.value||0),0);
const dueCount=()=>state.leads.filter(l=>isOpen(l)&&l.followUp&&l.followUp<=today()).length;

/* ---------- storage layer ---------- */
function localUpsert(l){
  const i=state.leads.findIndex(x=>x.id===l.id);
  if(i>=0)state.leads[i]=l;else state.leads.push(l);
  renderAll();
}
async function api(method,body,q){
  const r=await fetch('/api/leads'+(q||''),{method,headers:{'Content-Type':'application/json','x-crm-password':PW||'','x-crm-email':EM||''},body:body?JSON.stringify(body):undefined});
  if(r.status===401){signOut(true);throw new Error('Wrong password')}
  if(r.status===403){let m='Not allowed';try{const j=await r.json();if(j.error)m=j.error}catch(e){}throw new Error(m)}
  if(!r.ok){let m='Server error '+r.status;try{const j=await r.json();if(j.error)m=j.error}catch(e){}throw new Error(m)}
  return r.json();
}
async function loadAll(){
  const d=await api('GET');
  state.leads=(d.leads||[]).map(fixSource);
  state.me=d.me||{role:'admin',name:'Admin',email:''};
  state.team=d.team||[];
  if(!isAdmin()&&(state.view==='team'))state.view='dashboard';
  if(d.settings&&d.settings.currency)state.currency=d.settings.currency;
  state.loading=false;state.offline=false;renderAll();
}
async function saveLead(l){
  l=clean(l);
  if(IN_CLAUDE){
    if(leadsCol){try{await leadsCol.doc(l.id).set(l)}catch(e){toast('Could not save. '+(e&&e.message?e.message:'Try again.'));throw e}}
    else localUpsert(l);
    return;
  }
  localUpsert(l);
  try{await api('POST',{lead:l})}catch(e){toast('Could not save. '+e.message);loadAll().catch(()=>{});throw e}
}
async function patchLead(id,patch){
  const l=state.leads.find(x=>x.id===id);if(!l)return;
  await saveLead(Object.assign({},l,patch,{updated:Date.now()}));
}
async function removeLead(id){
  if(IN_CLAUDE&&leadsCol){try{await leadsCol.doc(id).delete()}catch(e){toast('Could not delete.');throw e}return}
  const keep=state.leads;
  state.leads=state.leads.filter(x=>x.id!==id);renderAll();
  if(!IN_CLAUDE){try{await api('DELETE',null,'?id='+encodeURIComponent(id))}catch(e){state.leads=keep;renderAll();toast('Could not delete.');throw e}}
}
async function saveCurrency(c){
  if(!isAdmin()){renderAll();return}
  state.currency=c;renderAll();
  try{
    if(IN_CLAUDE){if(settingsDoc)await settingsDoc.set({currency:c})}
    else await api('POST',{settings:{currency:c}});
  }catch(e){}
}
function signOut(wrong){
  try{localStorage.removeItem('pears_crm_pw');localStorage.removeItem('pears_crm_auth')}catch(e){}
  PW=null;EM='';state.leads=[];state.team=[];state.me=null;state.owner='all';state.view='dashboard';state.loading=true;renderAll();showLogin(wrong?'That email or password was not accepted.':'');
}
function showLogin(msg){$('#login').hidden=false;$('#lgerr').textContent=msg||'';setTimeout(()=>($('#lgem').value?$('#lgpw'):$('#lgem')).focus(),50)}
async function tryLogin(){
  const v=$('#lgpw').value;if(!v)return;
  const em=$('#lgem').value.trim().toLowerCase();
  PW=v;EM=em;
  try{await loadAll();try{localStorage.setItem('pears_crm_auth',JSON.stringify({e:em,p:v}));localStorage.removeItem('pears_crm_pw')}catch(e){}$('#login').hidden=true;$('#lgpw').value='';startPolling()}
  catch(e){PW=null;EM='';$('#lgerr').textContent=e.message==='Wrong password'?'That email or password was not accepted.':e.message}
}
let poll=null;
function startPolling(){
  clearInterval(poll);
  poll=setInterval(()=>{if(document.hidden||dragId||state.editing||state.view==='team')return;loadAll().catch(()=>{})},20000);
}

/* ---------- stage moves ---------- */
async function moveLead(id,stage){
  const l=state.leads.find(x=>x.id===id);
  if(!l||l.stage===stage)return;
  const act=(l.activity||[]).slice();
  act.unshift({t:Date.now(),text:'Moved from '+SNAME[l.stage]+' to '+SNAME[stage],by:actor()});
  let ms=l.maxStage!=null?l.maxStage:(RANK[l.stage]!=null?l.stage:'new');
  if(RANK[stage]!=null&&RANK[stage]>(RANK[ms]||0))ms=stage;
  try{await patchLead(id,{stage,maxStage:ms,activity:act});toast(l.name+' moved to '+SNAME[stage])}catch(e){}
}

/* ---------- filtering ---------- */
function filtered(){
  const q=state.q.trim().toLowerCase();
  let r=state.leads.filter(l=>{
    if(state.stage==='open'?!isOpen(l):(state.stage!=='all'&&l.stage!==state.stage))return false;
    if(state.source!=='all'&&l.source!==state.source)return false;
    if(state.owner==='none'?!!l.assignedTo:(state.owner!=='all'&&l.assignedTo!==state.owner))return false;
    if(state.due&&!(isOpen(l)&&l.followUp&&l.followUp<=today()))return false;
    if(q){const h=[l.name,l.company,l.phone,l.email,l.location,l.project,l.notes,ownerName(l)].join(' ').toLowerCase();if(!h.includes(q))return false}
    return true;
  });
  const s=state.sort;
  r.sort((a,b)=>
    s==='value'?(b.value||0)-(a.value||0):
    s==='followup'?((a.followUp||'9999')>(b.followUp||'9999')?1:-1):
    s==='name'?String(a.name).localeCompare(String(b.name)):
    (b.created||0)-(a.created||0));
  return r;
}

/* ---------- chrome ---------- */
function buildNav(){
  $('#nav').innerHTML=NAV.filter(n=>!n.admin||(isAdmin()&&!IN_CLAUDE)).map(n=>'<button class="nav-item" data-view="'+n.id+'">'+ic(n.icon)+'<span>'+n.name+'</span>'+(n.bd?'<span class="bd" id="'+n.bd+'">0</span>':'')+'</button>').join('');
  $('#add').innerHTML=ic('plus')+'<span>Add lead</span>';
  $('#export').innerHTML=ic('download');
  $('#signout').innerHTML=ic('logout');
}
function renderChrome(){
  const nk=isAdmin()?'a':'m';if(buildNav.k!==nk){buildNav.k=nk;buildNav()}
  document.querySelectorAll('.nav-item').forEach(b=>{const on=b.dataset.view===state.view;b.classList.toggle('on',on);b.setAttribute('aria-current',on?'page':'false')});
  const open=state.leads.filter(isOpen).length;
  const bl=$('#b-leads');if(bl)bl.textContent=state.leads.length;
  const bp=$('#b-pipe');if(bp)bp.textContent=open;
  const long=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  const T={
    dashboard:['Dashboard',long],
    leads:['Leads',state.leads.length+' leads · '+open+' open'],
    pipeline:['Pipeline','Drag a card to move a lead to another stage'],
    analytics:['Analytics',isAdmin()?'Performance across all leads':'Performance of your leads'],
    team:['Team','Business development team · assign leads and track each person']
  }[state.view]||['Dashboard',long];
  if(state.me&&!IN_CLAUDE)T[1]=T[1]+' · Signed in as '+state.me.name+(isAdmin()?' (admin)':'');
  $('#ptitle').textContent=T[0];$('#psub').textContent=T[1];
  $('#cur').value=state.currency;$('#cur').disabled=!isAdmin();
  $('#banner').innerHTML=state.offline?'<div class="banner">This page is not connected to a database, so changes are lost when you close it.</div>':'';
  $('#export').hidden=IN_CLAUDE?!downloads:false;
  $('#signout').hidden=IN_CLAUDE||!!BUILT_IN_PASSWORD;
}

/* ---------- dashboard ---------- */
function niceMax(v){if(v<=5)return 5;const p=Math.pow(10,Math.floor(Math.log10(v)));const m=v/p;return (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p}
function ringSvg(p){
  const r=64,c=2*Math.PI*r,d=c*Math.min(100,Math.max(0,p))/100;
  return '<svg class="ring" viewBox="0 0 170 170" aria-hidden="true"><circle cx="85" cy="85" r="'+r+'" fill="none" stroke="var(--line)" stroke-width="14"/><circle cx="85" cy="85" r="'+r+'" fill="none" stroke="var(--gold)" stroke-width="14" stroke-linecap="round" stroke-dasharray="'+d+' '+c+'" transform="rotate(-90 85 85)"/></svg>';
}
function kpi(icon,color,label,value,sub){
  return '<div class="card kpi"><span class="chip-ic" style="--kc:'+color+'">'+ic(icon,'lg')+'</span><div><div class="k">'+label+'</div><div class="x">'+value+'</div><div class="s">'+sub+'</div></div></div>';
}
function marketingHtml(){
  const days=state.mkRange==='all'?0:+state.mkRange;
  const cutoff=days?Date.now()-days*864e5:0;
  const L=state.leads.filter(l=>!days||(l.created||0)>=cutoff);
  const isQ=l=>reached(l)>=RANK.qualified;
  const isW=l=>l.stage==='won';
  const created=L.length,qual=L.filter(isQ).length,won=L.filter(isW).length;
  const max=niceMax(Math.max(created,qual,won));
  const ticks=[0,.25,.5,.75,1];
  const bar=(v,color,label)=>{const h=v?Math.max(v/max*100,1):0;return '<div class="mk-col"><div class="mk-area"><div class="mk-bar" style="height:'+h+'%;--bc:'+color+'"></div><div class="mk-val" style="bottom:calc('+h+'% + 4px)">'+v+'</div></div><div class="mk-lbl">'+label+'</div></div>'};
  const arrow=t=>'<div class="mk-arrow"><b>'+t+'</b>'+ic('arrow')+'</div>';
  const srcs=[...new Set(L.map(l=>l.source||'Unknown'))].map(name=>{
    const a=L.filter(l=>(l.source||'Unknown')===name);
    return {name,c:a.length,q:a.filter(isQ).length,w:a.filter(isW).length}}).sort((x,y)=>y.c-x.c);
  const conv=created?won/created*100:0;
  return '<div class="card"><div class="card-head"><h3>Marketing leads analysis</h3>'+
    '<button class="iconbtn" data-act="refresh" aria-label="Refresh" title="Refresh">'+ic('refresh')+'</button>'+
    '<select id="mkrange" class="sp" aria-label="Period">'+
      [['all','All time'],['30','Last 30 days'],['90','Last 90 days'],['180','Last 6 months']].map(o=>'<option value="'+o[0]+'"'+(state.mkRange===o[0]?' selected':'')+'>'+o[1]+'</option>').join('')+
    '</select></div>'+
    '<div class="mk-top"><div class="mk-chart" role="img" aria-label="Created '+created+', qualified '+qual+', won '+won+'">'+
      '<div class="mk-grid">'+ticks.map(t=>'<div style="bottom:'+t*100+'%"><span>'+(Math.round(max*t*10)/10)+'</span></div>').join('')+'</div>'+
      '<div class="mk-cols">'+bar(created,'var(--c-contacted)','Created leads')+arrow(pct(qual,created))+bar(qual,'var(--c-qualified)','Qualified leads')+arrow(pct(won,qual))+bar(won,'var(--c-won)','Won jobs')+'</div></div>'+
      '<div><div class="ringbox">'+ringSvg(conv)+'<div class="ringtxt"><b>'+pct(won,created)+'</b><span>Conversion rate</span></div></div>'+
      '<div class="ringcap"><b>'+won+'</b> won of <b>'+created+'</b> created</div></div></div>'+
    '<div class="mk-table"><table><thead><tr><th>Lead source</th><th class="c">Created leads</th><th class="c">Qualified leads</th><th class="c">Won jobs</th><th class="c">Conversion rate</th></tr></thead><tbody>'+
    (srcs.length?srcs.map(r=>'<tr data-source="'+esc(r.name)+'"><td><b>'+esc(r.name)+'</b></td><td class="c">'+r.c+'<small>'+pct(r.q,r.c)+'</small></td><td class="c">'+r.q+'<small>'+pct(r.w,r.q)+'</small></td><td class="c">'+r.w+'</td><td class="c"><span class="pill'+(r.w?' good':'')+'">'+pct(r.w,r.c)+'</span></td></tr>').join('')+
      '<tr><td>Total</td><td class="c">'+created+'</td><td class="c">'+qual+'</td><td class="c">'+won+'</td><td class="c">'+pct(won,created)+'</td></tr>'
      :'<tr><td colspan="5"><div class="empty">'+(state.loading?'Loading…':'No leads in this period.')+'</div></td></tr>')+
    '</tbody></table></div>'+
    '<div class="note">Qualified means a lead reached the Qualified stage or later. The grey percentage next to Created leads is the share that became qualified, and next to Qualified leads the share that were won. Select a source to see its leads.</div></div>';
}
function renderDashboard(){
  const all=state.leads;
  const open=all.filter(isOpen);
  const won=all.filter(l=>l.stage==='won'),lost=all.filter(l=>l.stage==='lost');
  const pipe=sumV(open);
  const weighted=open.reduce((x,l)=>x+(+l.value||0)*STAGES[IDX[l.stage]].p,0);
  const closed=won.length+lost.length;
  const wr=closed?Math.round(won.length/closed*100):null;
  const now=new Date();const mk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
  const prev=new Date(now.getFullYear(),now.getMonth()-1,1);
  const thisM=all.filter(l=>l.created&&mk(new Date(l.created))===mk(now)).length;
  const lastM=all.filter(l=>l.created&&mk(new Date(l.created))===mk(prev)).length;
  let delta='<span>Last month: '+lastM+'</span>';
  if(lastM){const d=Math.round((thisM-lastM)/lastM*100);delta='<span class="'+(d>=0?'up':'down')+'">'+(d>=0?'▲ ':'▼ ')+Math.abs(d)+'%</span><span>vs last month</span>'}
  else if(thisM)delta='<span class="up">▲ New this month</span>';
  const dueList=open.filter(l=>l.followUp&&l.followUp<=today()).sort((a,b)=>a.followUp>b.followUp?1:-1);
  const top=open.slice().sort((a,b)=>(b.value||0)-(a.value||0)).slice(0,5);
  const feed=[];all.forEach(l=>(l.activity||[]).forEach(a=>feed.push({t:a.t,text:a.text+(a.by?' · by '+a.by:''),name:l.name,id:l.id})));
  feed.sort((a,b)=>b.t-a.t);
  const total=all.length||1;
  const segs=TILES.map(id=>({id,n:all.filter(l=>l.stage===id).length}));
  const samples=isAdmin()&&all.some(l=>l.sample);

  $('#view').innerHTML='<div class="stack">'+
   '<div class="kpis">'+
     kpi('dollar','var(--c-contacted)','Open pipeline',money(pipe,true),open.length+' open leads')+
     kpi('trend','var(--c-qualified)','Weighted forecast',money(weighted,true),'Value × stage odds')+
     kpi('trophy','var(--c-won)','Win rate',wr==null?'—':wr+'%',won.length+' won, '+lost.length+' lost')+
     kpi('sparkles','var(--c-negotiation)','New leads this month',thisM,delta)+
     kpi('clock',dueList.length?'var(--danger)':'var(--c-new)','Follow-ups due',dueList.length,dueList.length?'<button class="btn small" data-act="due">View leads</button>':'Nothing overdue')+
   '</div>'+
   '<div class="card"><div class="card-head"><div><h3>Pipeline at a glance</h3><p class="hint">Select a stage to see its leads.</p></div>'+(samples?'<button class="btn small sp" data-act="clearsample">'+(state.armed==='sample'?'Confirm: remove sample leads':'Remove sample leads')+'</button>':'')+'</div>'+
     '<div class="seg" role="img" aria-label="Lead distribution by stage">'+segs.filter(s=>s.n).map(s=>'<i title="'+SNAME[s.id]+': '+s.n+'" style="flex:'+s.n+';--sc:var(--c-'+s.id+')"></i>').join('')+'</div>'+
     '<div class="tiles">'+segs.map(s=>{const items=all.filter(l=>l.stage===s.id);
       return '<button class="tile" data-stage="'+s.id+'" style="--sc:var(--c-'+s.id+')"><div class="tp"><span class="chip-ic">'+ic(SICON[s.id])+'</span><span class="ct">'+s.n+'</span></div><div class="nm">'+SNAME[s.id]+'</div><div class="val">'+money(sumV(items),true)+'</div></button>'}).join('')+'</div></div>'+
   marketingHtml()+
   '<div class="trio">'+
     '<div class="card"><div class="card-head"><h3>Follow-ups due</h3><span class="sp hint">'+dueList.length+' waiting</span></div>'+
       (dueList.length?dueList.slice(0,6).map(l=>{const d=dueInfo(l,true);return '<div class="li" data-open="'+esc(l.id)+'">'+avatar(l.name)+'<div class="body"><div class="t">'+esc(l.name)+'</div><div class="s">'+esc([l.project,l.location].filter(Boolean).join(' · '))+'</div></div><div class="r"><span class="due '+d.cls+'">'+ic('calendar','sm')+esc(d.text)+'</span>'+(l.phone?'<div><a class="due" href="tel:'+esc(l.phone.replace(/\s+/g,''))+'">'+ic('phone','sm')+esc(l.phone)+'</a></div>':'')+'</div></div>'}).join(''):'<div class="empty">'+ic('check')+'<b>All caught up</b>No follow-ups are due.</div>')+
     '</div>'+
     '<div class="card"><div class="card-head"><h3>Top opportunities</h3><span class="sp hint">By value, open leads</span></div>'+
       (top.length?top.map(l=>'<div class="li" data-open="'+esc(l.id)+'">'+avatar(l.name)+'<div class="body"><div class="t">'+esc(l.name)+'</div><div class="s">'+esc(l.project||'')+'</div></div><div class="r"><b>'+money(l.value,true)+'</b><div>'+stageChip(l.stage)+'</div></div></div>').join(''):'<div class="empty"><b>No open leads</b>Add a lead to see it here.</div>')+

/* ---------- analytics ---------- */
function bars(rows,color){
  const max=Math.max(1,...rows.map(r=>r.v));
  return rows.map(r=>'<div class="hb"><span class="lbl" title="'+esc(r.l)+'">'+esc(r.l)+'</span><div class="track"><i style="width:'+Math.max(0,r.v/max*100)+'%;--bc:'+(r.c||color||'var(--gold)')+'"></i></div><span class="val">'+r.t+(r.s?' <em>'+r.s+'</em>':'')+'</span></div>').join('');
}
function renderAnalytics(){
  const L=state.leads;
  if(!L.length){$('#view').innerHTML='<div class="card"><div class="empty"><b>No data yet</b>Add leads and move them through the pipeline to see analytics.</div></div>';return}
  const open=L.filter(isOpen);
  const won=L.filter(l=>l.stage==='won'),lost=L.filter(l=>l.stage==='lost');
  const pipe=sumV(open);
  const weighted=open.reduce((x,l)=>x+(+l.value||0)*STAGES[IDX[l.stage]].p,0);
  const closed=won.length+lost.length;
  const wr=closed?Math.round(won.length/closed*100):null;
  const avg=won.length?sumV(won)/won.length:0;
  const now=new Date();const mk=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
  const thisM=L.filter(l=>l.created&&mk(new Date(l.created))===mk(now)).length;
  const fun=PATH.map((id,i)=>({s:STAGES[IDX[id]],n:L.filter(l=>reached(l)>=i).length}));
  const funRows=fun.map((f,i)=>({l:f.s.name,v:f.n,t:String(f.n),s:i&&fun[i-1].n?Math.round(f.n/fun[i-1].n*100)+'%':'',c:'var(--c-'+f.s.id+')'}));
  const srcs=[...new Set(L.map(l=>l.source||'Unknown'))].map(s=>{
    const a=L.filter(l=>(l.source||'Unknown')===s);const w=a.filter(l=>l.stage==='won').length;const c=a.filter(l=>l.stage==='won'||l.stage==='lost').length;
    return {l:s,v:a.length,t:String(a.length),s:c?Math.round(w/c*100)+'% won':'no closed'}}).sort((a,b)=>b.v-a.v);
  const pts=[...new Set(L.map(l=>l.project||'Other'))].map(p=>{
    const a=L.filter(l=>(l.project||'Other')===p&&(isOpen(l)||l.stage==='won'));
    return {l:p,v:sumV(a),t:money(sumV(a),true),s:a.length+' lead'+(a.length===1?'':'s')}}).sort((a,b)=>b.v-a.v);
  const months=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push({k:mk(d),l:d.toLocaleDateString('en-GB',{month:'short'}),n:0})}
  L.forEach(l=>{if(!l.created)return;const m=months.find(x=>x.k===mk(new Date(l.created)));if(m)m.n++});
  const mmax=Math.max(1,...months.map(m=>m.n));
  $('#view').innerHTML=
  '<div class="kpis">'+
    kpi('dollar','var(--c-contacted)','Open pipeline',money(pipe,true),open.length+' open leads')+
    kpi('trend','var(--c-qualified)','Weighted forecast',money(weighted,true),'Value × stage odds')+
    kpi('percent','var(--c-won)','Win rate',wr==null?'—':wr+'%',won.length+' won, '+lost.length+' lost')+
    kpi('briefcase','var(--c-proposal)','Average won job',won.length?money(avg,true):'—',money(sumV(won),true)+' won in total')+
    kpi('sparkles','var(--c-negotiation)','New leads this month',thisM,dueCount()+' follow-ups due')+
  '</div>'+
  '<div class="grid2">'+
    '<div class="card"><h3>Conversion funnel</h3><p class="hint" style="margin-bottom:14px">Leads that reached each stage, with the share that moved on from the stage before.</p>'+bars(funRows)+'</div>'+
    '<div class="card"><h3>Leads per month</h3><p class="hint" style="margin-bottom:6px">Last six months by date added.</p><div class="cols">'+months.map(m=>'<div class="cc"><b>'+m.n+'</b><i style="height:'+Math.max(2,m.n/mmax*78)+'%"></i><span>'+m.l+'</span></div>').join('')+'</div></div>'+
    '<div class="card"><h3>Lead sources</h3><p class="hint" style="margin-bottom:14px">Where enquiries come from and how often they close.</p>'+bars(srcs)+'</div>'+
    '<div class="card"><h3>Value by project type</h3><p class="hint" style="margin-bottom:14px">Open and won value. Lost, not qualified and on-hold leads are excluded.</p>'+bars(pts,'var(--c-contacted)')+
      '<div class="note">Stage odds used for the forecast: '+OPEN.map(id=>SNAME[id]+' '+Math.round(STAGES[IDX[id]].p*100)+'%').join(', ')+'.</div></div>'+
  '</div>';
}

async function saveDrawer(){
  const name=$('#f_name').value.trim();
  if(!name){toast('Enter a name for this lead.');$('#f_name').focus();return}
  const base=state.editing!=='new'?state.leads.find(x=>x.id===state.editing):null;
  const stage=$('#f_stage').value;
  const lead=Object.assign({},base||{id:newId(),created:Date.now(),activity:[{t:Date.now(),text:'Lead created',by:actor()}],maxStage:'new'},{
    name,company:$('#f_company').value.trim(),phone:$('#f_phone').value.trim(),email:$('#f_email').value.trim(),
    project:$('#f_project').value,location:$('#f_location').value.trim(),value:parseFloat($('#f_value').value)||0,
    source:$('#f_source').value,followUp:$('#f_follow').value,notes:$('#f_notes').value.trim(),stage,updated:Date.now()});
  if(base&&base.stage!==stage){
    lead.activity=[{t:Date.now(),text:'Moved from '+SNAME[base.stage]+' to '+SNAME[stage],by:actor()}].concat(lead.activity||[]);
  }
  let assignedNow=false;
  const ow=$('#f_owner');
  if(ow){
    const to=ow.value,before=base?(base.assignedTo||''):'';
    if(to!==before){
      const m=memberByEmail(to);
      lead.assignedTo=to;lead.assignedName=m?m.name:'';
      lead.assignedAt=Date.now();lead.assignedBy=actor();
      lead.activity=[{t:Date.now(),text:to?'Assigned to '+(m?m.name:to):'Unassigned',by:actor()}].concat(lead.activity||[]);
      assignedNow=!!to;
    }
  }else if(!base&&!IN_CLAUDE&&state.me&&!isAdmin()){
    lead.assignedTo=state.me.email;lead.assignedName=state.me.name;
  }
  let ms=lead.maxStage||'new';
  if(RANK[stage]!=null&&RANK[stage]>(RANK[ms]||0))ms=stage;
  lead.maxStage=ms;
  try{await saveLead(lead);closeDrawer();
    if(assignedNow)toast((base?'Saved':'Lead added')+' · assigned to '+ownerName(lead),assignMailto(lead),'Email them');
    else toast(base?'Saved':'Lead added');
  }catch(e){}
}
async function addNote(){
  const inp=$('#f_note');const txt=inp.value.trim();if(!txt)return;
  const l=state.leads.find(x=>x.id===state.editing);if(!l)return;
  const act=[{t:Date.now(),text:txt,by:actor()}].concat(l.activity||[]);
  try{await patchLead(l.id,{activity:act});inp.value='';
    const fresh=state.leads.find(x=>x.id===l.id)||Object.assign({},l,{activity:act});
    $('#loglist').innerHTML=logHtml(fresh)}catch(e){}
}

/* ---------- export ---------- */
async function exportCsv(){
  const cols=['name','company','phone','email','project','location','value','source','stage','followUp','assignedName','assignedTo','notes'];
  const cell=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const text='\ufeff'+[cols.join(',')].concat(state.leads.map(l=>cols.map(c=>cell(l[c])).join(','))).join('\r\n');
  const filename='pearls-leads-'+today()+'.csv';
  if(IN_CLAUDE){
    if(!downloads)return;
    try{await downloads.save({filename,data:text})}catch(e){if(!e||e.code!=='declined')toast('Could not export the file.')}
    return;
  }
  const blob=new Blob([text],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const t=e.target;
  const tile=t.closest('.tile');
  if(tile){const s=tile.dataset.stage;state.stage=s;state.due=false;state.view='leads';renderAll();window.scrollTo(0,0);return}
  const nav=t.closest('.nav-item');if(nav){setView(nav.dataset.view);return}
  const act=t.closest('[data-act]');
  if(act){
    const a=act.dataset.act;
    if(a==='close')closeDrawer();
    else if(a==='save')saveDrawer();
    else if(a==='note')addNote();
    else if(a==='tmedit'){state.teamEdit=act.dataset.email;state.armed=null;renderView();window.scrollTo(0,0)}
    else if(a==='tmcancel'){state.teamEdit=null;renderView()}
    else if(a==='tmdel'){const em=act.dataset.email;if(state.armed!=='tm:'+em){state.armed='tm:'+em;renderView()}else removeMember(em)}
    else if(a==='refresh'){if(!IN_CLAUDE)loadAll().catch(()=>{});else renderAll();toast('Refreshed')}
    else if(a==='due'){state.due=true;state.stage='all';state.view='leads';renderAll();window.scrollTo(0,0)}
    else if(a==='delete'){
      if(state.armed!=='del'){state.armed='del';act.textContent='Confirm delete';act.classList.add('armed')}
      else{const id=state.editing;state.armed=null;try{await removeLead(id);closeDrawer();toast('Lead deleted')}catch(err){}}
    }else if(a==='clearsample'){
      if(state.armed!=='sample'){state.armed='sample';renderView()}
      else{state.armed=null;const ids=state.leads.filter(l=>l.sample).map(l=>l.id);
        try{for(const id of ids)await removeLead(id);toast('Sample leads removed')}catch(err){}renderView()}
    }
    return;
  }
  if(t.closest('#add')){openDrawer(null);return}
  if(t.closest('#export')){exportCsv();return}
  if(t.closest('#signout')){signOut(false);return}
  if(t.id==='cleardue'){state.due=false;renderAll();return}
  if(t.id==='clearowner'){state.owner='all';renderAll();return}
  const orow=!t.closest('a')&&t.closest('tr[data-owner]');
  if(orow){state.owner=orow.dataset.owner;state.stage='all';state.source='all';state.due=false;state.view='leads';renderAll();window.scrollTo(0,0);return}
  if(t.id==='scrim'){closeDrawer();return}
  if(t.closest('select[data-move]')||t.closest('a'))return;
  const srow=t.closest('tr[data-source]');
  if(srow){state.source=srow.dataset.source;state.stage='all';state.due=false;state.view='leads';renderAll();window.scrollTo(0,0);return}
  const row=t.closest('tr[data-id]')||t.closest('.card2[data-id]');
  if(row){openDrawer(row.dataset.id);return}
  const op=t.closest('[data-open]');
  if(op)openDrawer(op.dataset.open);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.move){moveLead(t.dataset.move,t.value);return}
  if(t.id==='cur'){saveCurrency(t.value);return}
  if(t.id==='mkrange'){state.mkRange=t.value;renderAll();return}
  if(t.id==='fstage'){state.stage=t.value;renderAll()}
  if(t.id==='fsource'){state.source=t.value;renderAll()}
  if(t.id==='fowner'){state.owner=t.value;renderAll()}
  if(t.id==='fsort'){state.sort=t.value;updateLeadsList()}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){state.q=e.target.value;updateLeadsList()}});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&state.editing)closeDrawer();
  if(e.key==='Enter'){
    if(e.target.id==='f_note'){e.preventDefault();addNote()}
    else if(state.editing&&e.target.tagName==='INPUT'&&e.target.id!=='f_note'){e.preventDefault();saveDrawer()}
    else if(e.target.classList&&e.target.classList.contains('card2'))openDrawer(e.target.dataset.id);
  }
});
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('.card2');if(!c)return;dragId=c.dataset.id;c.classList.add('drag');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(x){}});
document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.drag,.over').forEach(n=>n.classList.remove('drag','over'))});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('.col');if(!c||!dragId)return;e.preventDefault();document.querySelectorAll('.col.over').forEach(n=>{if(n!==c)n.classList.remove('over')});c.classList.add('over')});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('.col');if(!c||!dragId)return;e.preventDefault();const id=dragId;dragId=null;c.classList.remove('over');moveLead(id,c.dataset.stage)});
$('#lgform').addEventListener('submit',e=>{e.preventDefault();tryLogin()});
document.addEventListener('submit',e=>{if(e.target.id==='tmform'){e.preventDefault();saveMember()}});

/* ---------- boot ---------- */
buildNav();
renderAll();
(async function boot(){
  if(IN_CLAUDE){
    let db=null;
    try{db=await window.claude.use('db')}catch(e){db=null}
    try{downloads=await window.claude.use('downloads')}catch(e){downloads=null}
    if(!db){state.offline=true;state.loading=false;renderAll();return}
    leadsCol=db.collection('leads');
    settingsDoc=db.doc('settings/main');
    settingsDoc.onSnapshot(s=>{if(s.exists){const c=(s.data()||{}).currency;if(c&&c!==state.currency){state.currency=c;renderAll()}}},()=>{});
    leadsCol.onSnapshot(snap=>{
      state.leads=snap.docs.map(d=>fixSource(Object.assign({id:d.id},d.data())));
      state.loading=false;renderAll();
    },()=>{state.loading=false;state.offline=true;renderAll()});
    renderAll();
    return;
  }
  if(PW){
    try{await loadAll();startPolling()}
    catch(e){state.loading=false;renderAll();if(e.message!=='Wrong password')$('#banner').innerHTML='<div class="banner">Could not reach the server: '+esc(e.message)+'</div>'}
  }else showLogin('');
})();
})();
</script>
